name: Publish

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

env:
  MISE_ENV: ci,release

# A manual run from the default branch and a Version PR merged into it from
# this repository share one group, so they never publish at the same time. Every other closed pull
# request also starts this workflow; it gets a group of its own, since a group
# keeps one pending run and a no-op run would replace a waiting release.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
         (github.event.pull_request.merged &&
          github.event.pull_request.base.ref == github.event.repository.default_branch &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'version-packages'))
        && 'publish' || format('publish-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event.pull_request.merged &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'version-packages')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.10
          cache: true
      - run: mise install --locked
      # Publishes every crate with `cargo publish --workspace` (.ctl/ver.yaml),
      # then tags the release and opens the GitHub Release.
      - uses: victor-software-house/verctl/actions/publish@a285b8170771430310c538890901a203c245e22c # v0.4.4
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
