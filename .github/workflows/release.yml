name: Release

# verctl's reusable release workflow, on every push to main and on demand.
# It plans every version commit not yet fully released and publishes each at
# that commit, whatever main's HEAD is now, then opens or updates the Version
# PR. A run stopped by the crates.io rate limit resumes on the next push or
# dispatch, since each crate crates.io already lists is skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: write # tags, Releases, and verctl/release/main without the App
      pull-requests: write # the Version PR without the App
    uses: victor-software-house/verctl/.github/workflows/release.yml@d3118cc5e257db6cb254263efd3f84cd6aae8f8a # v0.5.2
    with:
      mise-version: 2026.10.10
      mise-env: ci,release
    # The App token opens the Version PR so that its CI starts; a PR opened
    # with GITHUB_TOKEN starts no workflow.
    secrets:
      app-client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
      registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
