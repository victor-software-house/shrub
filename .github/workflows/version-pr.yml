name: Version PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  MISE_ENV: ci,release

concurrency:
  group: version-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      # verctl prepares the release, and its prepare.after runs
      # `cargo update --workspace` (.ctl/ver.yaml), which needs rust.
      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.10
          cache: true
          install_args: rust github:victor-software-house/verctl
      # A Version PR opened with GITHUB_TOKEN starts no workflow, so its CI
      # would never run; the App token does start them.
      - name: Mint Version PR token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: victor-software-house/verctl/actions/version-pr@2a7b33d023488fa62417e3061bd523ab2ba098de # v0.4.8
        with:
          token: ${{ steps.app-token.outputs.token }}
