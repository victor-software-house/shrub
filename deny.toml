[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
# RUSTSEC ids and yanked crates that cannot be upgraded yet. Not a lint-level downgrade.
ignore = [
  # pin-utils is unmaintained (archived 2026-10-01) and reaches shrub only in
  # tests: expectrl 0.9.0 -> nix 0.26 -> pin-utils. expectrl 0.9.0 is its latest
  # release. Remove this entry when expectrl releases without nix 0.26.
  { id = "RUSTSEC-2026-0441", reason = "test-only, via expectrl 0.9.0's nix 0.26; no expectrl release without it" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    # git-version and junit-parser
    "BSD-2-Clause",
    # check_elevation
    "BSD-3-Clause",
    # notify and tiny-keccak, through the coreutils builtins
    "CC0-1.0",
    # inotify and is_ci
    "ISC",
    # colored and indent, in tests
    "MPL-2.0",
    # libfuzzer-sys, in the fuzz targets
    "NCSA",
    # terminfo, in shrub-core
    "WTFPL",
    # const_format, foldhash and konst
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# Two versions of one crate fail. A repository whose dependencies still need
# two versions, after updating each to its latest release, adds a skip below
# deny = [...], one entry per crate with the reason, and removes it when the
# graph converges:
# skip = [{ crate = "syn@2", reason = "<crate> <version>, the latest, requires syn 2" }]
skip = [
  { crate = "bitflags@1.3.2", reason = "nix 0.26.4, through expectrl 0.9.0, the latest, requires bitflags 1" },
  { crate = "crypto-common@0.1.7", reason = "digest 0.10.7, through crc-fast 1.9.0, requires crypto-common 0.1" },
  { crate = "darling@0.20.11", reason = "cached_proc_macro 2.0.0, through cached 2.0.2, requires darling 0.20" },
  { crate = "darling_core@0.20.11", reason = "darling 0.20.11 requires darling_core 0.20" },
  { crate = "darling_macro@0.20.11", reason = "darling 0.20.11 requires darling_macro 0.20" },
  { crate = "digest@0.10.7", reason = "crc-fast 1.9.0 requires digest 0.10" },
  { crate = "getrandom@0.2.17", reason = "rand_core 0.6.4, through rand 0.8.8, and const-random-macro 0.1.16, the latest, require getrandom 0.2" },
  { crate = "hashbrown@0.14.5", reason = "ordered-multimap 0.7.3, the latest, requires hashbrown 0.14" },
  { crate = "hashbrown@0.16.1", reason = "cached 2.0.2 and lru 0.16.4 require hashbrown 0.16" },
  { crate = "miniz_oxide@0.8.9", reason = "backtrace 0.3.76 requires miniz_oxide 0.8" },
  { crate = "nix@0.26.4", reason = "expectrl 0.9.0 and ptyprocess 0.5.0, the latest, require nix 0.26" },
  { crate = "nom@7.1.3", reason = "color-print-proc-macro 0.3.7 and terminfo 0.9.0, the latest, require nom 7" },
  { crate = "quick-xml@0.41.0", reason = "junit-report 0.9.1, the latest, requires quick-xml 0.41" },
  { crate = "rand@0.8.8", reason = "num-bigint 0.4.8, num-prime 0.5.0 and phf_generator 0.11.3 require rand 0.8" },
  { crate = "rand_chacha@0.3.1", reason = "rand 0.8.8 requires rand_chacha 0.3" },
  { crate = "rand_core@0.6.4", reason = "rand 0.8.8 and rand_chacha 0.3.1 require rand_core 0.6" },
  { crate = "syn@2.0.119", reason = "thiserror-impl 1.0.69, darling_core 0.20.11 and other proc macros require syn 2; syn 3 serves the rest" },
  { crate = "thiserror@1.0.69", reason = "filedescriptor 0.8.3, the latest, requires thiserror 1" },
  { crate = "thiserror-impl@1.0.69", reason = "thiserror 1.0.69 requires thiserror-impl 1" },
  { crate = "unicode-width@0.1.14", reason = "ansi-width 0.1.0 and miette 7.6.0, the latest, require unicode-width 0.1" },
  { crate = "wasi@0.11.1", reason = "getrandom 0.2.17 and mio 1.2.4, the latest, require wasi 0.11" },
  { crate = "windows@0.44.0", reason = "conpty 0.5.1 requires windows 0.44" },
  { crate = "windows-sys@0.52.0", reason = "check_elevation 0.3.0, the latest, requires windows-sys 0.52" },
  { crate = "windows-sys@0.60.2", reason = "notify 8.2.0 requires windows-sys 0.60" },
  { crate = "windows-targets@0.42.2", reason = "windows 0.44.0 requires windows-targets 0.42" },
  { crate = "windows-targets@0.52.6", reason = "windows-sys 0.52.0 requires windows-targets 0.52" },
  { crate = "windows_aarch64_gnullvm@0.42.2", reason = "windows-targets 0.42.2 requires windows_aarch64_gnullvm 0.42" },
  { crate = "windows_aarch64_gnullvm@0.52.6", reason = "windows-targets 0.52.6 requires windows_aarch64_gnullvm 0.52" },
  { crate = "windows_aarch64_msvc@0.42.2", reason = "windows-targets 0.42.2 requires windows_aarch64_msvc 0.42" },
  { crate = "windows_aarch64_msvc@0.52.6", reason = "windows-targets 0.52.6 requires windows_aarch64_msvc 0.52" },
  { crate = "windows_i686_gnu@0.42.2", reason = "windows-targets 0.42.2 requires windows_i686_gnu 0.42" },
  { crate = "windows_i686_gnu@0.52.6", reason = "windows-targets 0.52.6 requires windows_i686_gnu 0.52" },
  { crate = "windows_i686_msvc@0.42.2", reason = "windows-targets 0.42.2 requires windows_i686_msvc 0.42" },
  { crate = "windows_i686_msvc@0.52.6", reason = "windows-targets 0.52.6 requires windows_i686_msvc 0.52" },
  { crate = "windows_x86_64_gnu@0.42.2", reason = "windows-targets 0.42.2 requires windows_x86_64_gnu 0.42" },
  { crate = "windows_x86_64_gnu@0.52.6", reason = "windows-targets 0.52.6 requires windows_x86_64_gnu 0.52" },
  { crate = "windows_x86_64_gnullvm@0.42.2", reason = "windows-targets 0.42.2 requires windows_x86_64_gnullvm 0.42" },
  { crate = "windows_x86_64_gnullvm@0.52.6", reason = "windows-targets 0.52.6 requires windows_x86_64_gnullvm 0.52" },
  { crate = "windows_x86_64_msvc@0.42.2", reason = "windows-targets 0.42.2 requires windows_x86_64_msvc 0.42" },
  { crate = "windows_x86_64_msvc@0.52.6", reason = "windows-targets 0.52.6 requires windows_x86_64_msvc 0.52" },
  { crate = "windows_i686_gnullvm@0.52.6", reason = "windows-targets 0.52.6 requires windows_i686_gnullvm 0.52" },
]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies carry no version; wildcards stay denied for the rest.
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "openssl", reason = "TLS is rustls" },
    { crate = "native-tls", reason = "TLS is rustls" },
]

# Declarations repeated outside [workspace.dependencies], and unused entries.
[bans.workspace-dependencies]
duplicates = "deny"
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
