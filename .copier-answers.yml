# Changes here will be overwritten by Copier; edit with `copier update --data`.
_commit: v0.0.103
_src_path: https://github.com/victor-software-house/templates.git
build_os: linux
cargo_min_publish_age: 3 days
cargo_trusted_owners:
- any-victor
ci_runner: github-hosted
clippy_disallowed_methods: []
clippy_disallowed_types: []
default_branch: main
deny_bans: []
deny_ignore: []
deny_licenses:
-   license: BSD-2-Clause
    reason: git-version and junit-parser
-   license: BSD-3-Clause
    reason: check_elevation
-   license: CC0-1.0
    reason: notify and tiny-keccak, through the coreutils builtins
-   license: ISC
    reason: inotify and is_ci
-   license: MPL-2.0
    reason: colored and indent, in tests
-   license: NCSA
    reason: libfuzzer-sys, in the fuzz targets
-   license: WTFPL
    reason: terminfo, in shrub-core
-   license: Zlib
    reason: const_format, foldhash and konst
feature_sets: []
generated_paths: []
github_owner: victor-software-house
layout: workspace
linux_image: ubuntu-26.04
max_width: 100
merge_queue: true
merge_queue_cancel_lower: true
mise_version: 2026.11.6
nightly_fmt: true
pieces:
- hooks
- lint_markdown
- lint_toml
- lint_typos
- ci
- drift_check
- rust_tasks
- rustfmt
- clippy
- cargo_lints
- deny
pieces_extra:
- lint_workflows
- machete
- doc_tests
- rustdoc
platforms:
- linux-x64
- linux-arm64
- macos-arm64
project: rust-crate
published: true
repository_visibility: public
rust_nightly: nightly-2026-09-29
rust_version: 1.100.0
test_profiles: []
tokio: true
verify_timeout: 30
workflow_policy:
- drafts
- concurrency
- labels
- permissions
- pins
- mise_env
workflow_policy_namespaces: []
