[package]
name = "shrub-interactive"
description = "Interactive layer of shrub-shell"
version.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
default = []
basic = ["vt"]
completion = []
minimal = []
# `minimal` reads input when standard input isn't a terminal.
vt = ["dep:unicode-width", "completion", "minimal"]
# The backend is built only where reedline builds (not, e.g., on wasm); see
# `build.rs`.
reedline = ["dep:reedline", "dep:nu-ansi-term", "completion", "highlighting"]
highlighting = []

[lints]
workspace = true

[dependencies]
bon = { workspace = true }
shrub-parser = { workspace = true }
shrub-core = { workspace = true }
indexmap = { workspace = true }
radix_trie = "0.3.0"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
unicode-width = { version = "0.2.2", optional = true }

# reedline builds only for these targets; see `build.rs`.
[target.'cfg(any(unix, windows))'.dependencies]
nu-ansi-term = { version = "0.50.3", optional = true }
reedline = { version = "0.52.0", optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true, features = ["unstable"] }
vt100 = "0.16.2"
