# The repository's own checks. check:repo runs check:local after the shared
# checks, so a repository replaces run, or adds depends, with its own checks.
# A starter: the template writes this file once and never rewrites it.
"check:local" = { description = "This repository's own checks", depends = [
  "check:sys-boundary",
  "check:workflows",
] }

# shrub-core keeps platform code under its sys module; the rule flags target
# cfgs anywhere else in the crate. `ast-grep test` proves the rule against its
# own cases first.
"check:sys-boundary" = { description = "Platform cfgs in shrub-core stay under sys", run = [
  "ast-grep test --skip-snapshot-tests",
  "ast-grep scan",
] }

# zizmor's offline audits: no network, so the result depends only on the tree.
"check:workflows" = { description = "Workflow security audit (zizmor, offline)", run = "zizmor --offline .github" }
