[package]
name = "shrub-builtins"
description = "Builtins for a POSIX/bash shell (used by shrub-shell)"
version.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
default = [
  'builtin.alias',
  'builtin.bg',
  'builtin.bind',
  'builtin.break',
  'builtin.builtin',
  'builtin.caller',
  'builtin.cd',
  'builtin.colon',
  'builtin.command',
  'builtin.compgen',
  'builtin.compopt',
  'builtin.complete',
  'builtin.continue',
  'builtin.declare',
  'builtin.dirs',
  'builtin.dot',
  'builtin.echo',
  'builtin.enable',
  'builtin.eval',
  'builtin.exec',
  'builtin.exit',
  'builtin.export',
  'builtin.false',
  'builtin.fc',
  'builtin.fg',
  'builtin.getopts',
  'builtin.hash',
  'builtin.help',
  'builtin.history',
  'builtin.jobs',
  'builtin.kill',
  'builtin.let',
  'builtin.mapfile',
  'builtin.popd',
  'builtin.printf',
  'builtin.pushd',
  'builtin.pwd',
  'builtin.read',
  'builtin.return',
  'builtin.set',
  'builtin.shift',
  'builtin.shopt',
  'builtin.suspend',
  'builtin.test',
  'builtin.times',
  'builtin.trap',
  'builtin.true',
  'builtin.type',
  'builtin.ulimit',
  'builtin.umask',
  'builtin.unalias',
  'builtin.unset',
  'builtin.wait',
]

'builtin.alias' = []
'builtin.bg' = []
'builtin.bind' = []
'builtin.break' = []
'builtin.builtin' = []
'builtin.caller' = []
'builtin.cd' = []
'builtin.colon' = []
'builtin.command' = []
'builtin.compgen' = []
'builtin.complete' = []
'builtin.compopt' = []
'builtin.continue' = []
'builtin.declare' = []
'builtin.dirs' = []
'builtin.dot' = []
'builtin.echo' = []
'builtin.enable' = []
'builtin.eval' = []
'builtin.exec' = ['builtin.command', 'dep:shrub-process']
'builtin.exit' = []
'builtin.export' = []
'builtin.false' = []
'builtin.fc' = []
'builtin.fg' = []
'builtin.getopts' = []
'builtin.hash' = []
'builtin.help' = []
'builtin.history' = []
'builtin.jobs' = []
'builtin.kill' = []
'builtin.let' = []
'builtin.mapfile' = []
'builtin.popd' = []
'builtin.printf' = []
'builtin.pushd' = []
'builtin.pwd' = []
'builtin.read' = []
'builtin.return' = []
'builtin.set' = []
'builtin.shift' = []
'builtin.shopt' = []
'builtin.suspend' = []
'builtin.test' = []
'builtin.times' = []
'builtin.trap' = []
'builtin.true' = []
'builtin.type' = []
'builtin.ulimit' = []
'builtin.umask' = []
'builtin.unalias' = []
'builtin.unset' = []
'builtin.wait' = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cap-lints", "warn"]

[lints]
workspace = true

[dependencies]
shrub-core = { workspace = true }
shrub-parser = { workspace = true }
shrub-process = { workspace = true, optional = true }
cfg-if = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "wrap_help"] }
fancy-regex = { workspace = true }
itertools = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utf8-chars = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

[target.'cfg(any(unix, windows))'.dependencies]
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
] }
uucore = { workspace = true, features = ["format", "signals"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = [
  "fs",
  "process",
  "resource",
  "signal",
  "term",
  "user",
] }
rlimit = "0.11.0"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
procfs = "0.18.0"

[dev-dependencies]
anyhow = { workspace = true }
pretty_assertions = { workspace = true, features = ["unstable"] }
proptest = { workspace = true }
tempfile = { workspace = true }
