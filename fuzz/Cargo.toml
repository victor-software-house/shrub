[package]
name = "shrub-fuzz"
description = "Fuzz tests for shrub"
publish = false
version = "0.2.2"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
# Application tier; see docs/reference/msrv-policy.md.
rust-version = "1.95.0"

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
assert_cmd = "2.2.0"
libfuzzer-sys = "0.4"
tokio = { version = "1.52.3", features = ["rt"] }

[dependencies.shrub-core]
path = "../shrub-core"

[dependencies.shrub-parser]
path = "../shrub-parser"
features = ["arbitrary"]

[dependencies.shrub-interactive]
path = "../shrub-interactive"
features = ["highlighting"]

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_arithmetic"
path = "fuzz_targets/fuzz_arithmetic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_highlight"
path = "fuzz_targets/fuzz_highlight.rs"
test = false
doc = false
bench = false
