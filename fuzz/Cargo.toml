[package]
name = "shrub-fuzz"
description = "Fuzz tests for shrub"
publish = false
version = "0.2.2"
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
assert_cmd = { workspace = true }
libfuzzer-sys = "0.4"
tokio = { workspace = true, features = ["rt"] }

[dependencies.shrub-core]
workspace = true

[dependencies.shrub-parser]
workspace = true
features = ["arbitrary"]

[dependencies.shrub-interactive]
workspace = true
features = ["highlighting"]

[[bin]]
name = "fuzz-parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-arithmetic"
path = "fuzz_targets/fuzz_arithmetic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-highlight"
path = "fuzz_targets/fuzz_highlight.rs"
test = false
doc = false
bench = false
