[workspace]
resolver = "3"
members = [
  "shrub",
  "shrub-shell",
  "shrub-parser",
  "shrub-core",
  "shrub-builtins",
  "shrub-coreutils-builtins",
  "shrub-experimental-builtins",
  "shrub-interactive",
  "shrub-test-harness",
  "fuzz",
  "xtask",
]

[workspace.package]
version = "0.0.4"
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
keywords = ["cli", "shell", "sh", "bash", "script"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/victor-software-house/shrub"
rust-version = "1.99.0"

[workspace.dependencies]
# Internal crates. Exact versions: every crate releases together at the workspace
# version, and .ctl/ver.yaml rewrites these requirements on each bump.
shrub-builtins = { version = "=0.0.4", path = "shrub-builtins" }
shrub-core = { version = "=0.0.4", path = "shrub-core" }
shrub-coreutils-builtins = { version = "=0.0.4", path = "shrub-coreutils-builtins" }
shrub-experimental-builtins = { version = "=0.0.4", path = "shrub-experimental-builtins" }
shrub-interactive = { version = "=0.0.4", path = "shrub-interactive" }
shrub-parser = { version = "=0.0.4", path = "shrub-parser" }
shrub-shell = { version = "=0.0.4", path = "shrub-shell", default-features = false }
shrub-test-harness = { path = "shrub-test-harness" }
anyhow = "1.0.102"
assert_cmd = "2.2.0"
assert_fs = "1.1.3"
bon = "3.9.1"
cached = "2.0.2"
cfg-if = "1.0.4"
chrono = "0.4.44"
clap = "4.6.0"
color-print = "0.3.7"
colored = "3.1.1"
criterion = "0.8.2"
descape = "3.0.0"
diff = "0.1.13"
expectrl = "0.9.0"
fancy-regex = "0.19.0"
getrandom = "0.4.2"
glob = "0.3.3"
indent = "0.1.1"
indexmap = "2.13.0"
insta = "1.47.1"
itertools = "0.15.0"
junit-report = "0.9.0"
libc = "0.2.184"
miette = { version = "7.6.0", default-features = false }
nix = "0.31.2"
os-release = "0.1.0"
pretty_assertions = "1.4.1"
regex = "1.12.3"
serde = "1.0.228"
serde_json = "1.0.149"
strip-ansi-escapes = "0.2.1"
strum = "0.28.0"
tempfile = "3.27.0"
test-with = { version = "0.17.0", default-features = false }
thiserror = "2.0.18"
tokio = "1.52.3"
tracing = "0.1.44"
utf8-chars = "3.0.6"
uucore = { version = "0.12.0", default-features = false }
uuid = "1"
version-compare = "0.2.1"
walkdir = "2.5.0"
yaml_serde = "0.10.7"

[workspace.lints.rust]
warnings = { level = "deny" }
future_incompatible = { level = "deny" }
missing_docs = { level = "deny" }
nonstandard_style = { level = "deny" }
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_attributes = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
# For now we allow unknown lints so we can opt into warnings that don't exist on the
# oldest toolchain we need to support.
unknown_lints = { level = "allow", priority = -100 }

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

# Denied rules
expect_used = "deny"
format_push_string = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
tests_outside_test_module = "deny"
todo = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

# Allowed rules
bool_to_int_with_if = "allow"
cognitive_complexity = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
if_not_else = "allow"
if_same_then_else = "allow"
match_same_arms = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
redundant_pub_crate = "allow"
result_large_err = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
strip = "debuginfo"
