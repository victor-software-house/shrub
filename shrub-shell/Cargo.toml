[package]
name = "shrub-shell"
description = "Rust-implemented shell focused on POSIX and bash compatibility"
version.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

# The `shrub` binary and its end-to-end tests live in the `shrub` crate. The
# completion tests here run the completion engine in process.
[[test]]
name = "shrub-completion-tests"
path = "tests/completion_tests.rs"

# Generates man pages, markdown help, completion scripts, and the config
# schema. Lives here so that xtask doesn't have to depend on shrub-shell;
# `cargo xtask gen` shells out to it.
[[example]]
name = "gen"
path = "examples/gen.rs"
required-features = ["schema"]

[[bench]]
name = "shell"
path = "benches/shell.rs"
harness = false

[features]
# Input backends. Each can be enabled for any target, and is offered where it
# works (see `build.rs`), so the defaults suit every target.
default = ["basic", "reedline", "minimal", "vt"]
basic = ["shrub-interactive/basic"]
minimal = ["shrub-interactive/minimal"]
reedline = ["shrub-interactive/reedline"]
vt = ["shrub-interactive/vt"]
experimental = [
  "experimental-builtins",
  "experimental-bundled-coreutils",
  "experimental-load",
  "experimental-parser",
]
experimental-builtins = ["dep:shrub-experimental-builtins"]
experimental-bundled-coreutils = [
  "dep:shrub-coreutils-builtins",
  "shrub-coreutils-builtins/coreutils.all",
]
experimental-load = ["dep:serde_json", "shrub-core/serde"]
experimental-parser = [
  "shrub-core/experimental-parser",
  "shrub-parser/winnow-parser",
]
schema = ["dep:schemars"]

# `all-features` would also build the bundled coreutils (about 80 uutils
# crates) and the unfinished `experimental-parser`, only to show two more
# `CommandLineArgs` fields (`--load` and `--experimental-parser`). `schema`
# adds the `JsonSchema` impls on the config types.
[package.metadata.docs.rs]
features = ["schema"]
rustdoc-args = ["--cap-lints", "warn"]

[lints]
workspace = true

[dependencies]
shrub-core = { workspace = true }
shrub-builtins = { workspace = true }
shrub-interactive = { workspace = true }
shrub-coreutils-builtins = { workspace = true, optional = true }
shrub-experimental-builtins = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive", "env"] }
color-print = { workspace = true }
etcetera = "0.11.0"
schemars = { version = "1.2.1", optional = true }
serde = { workspace = true, features = ["derive"] }
toml = "1.1.0"
const_format = "0.2.36"
git-version = "0.3.9"
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3.23"
human-panic = "2.0.6"

[target.'cfg(not(any(unix, windows)))'.dependencies]
tokio = { workspace = true, features = ["rt", "sync"] }

[target.'cfg(any(unix, windows))'.dependencies]
crossterm = "0.29.0"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync"] }

[target.wasm32-unknown-unknown.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
anyhow = { workspace = true }
# Used by the `gen` example.
clap-markdown = "0.1.5"
clap_complete = "4.6.4"
clap_mangen = "0.3.0"
# Also a regular optional dependency, enabled by `experimental-load`. The `gen`
# example needs it without that feature, so it's listed here too.
serde_json = { workspace = true }
shrub-parser = { workspace = true }
assert_fs = { workspace = true }
criterion = { workspace = true, features = ["async_tokio", "html_reports"] }
pretty_assertions = { workspace = true, features = ["unstable"] }
serde = { workspace = true, features = ["derive"] }
test-with = { workspace = true, features = ["executable"] }
tokio = { workspace = true, features = ["time"] }

# Used only on wasm32, to enable the JavaScript backends; no code names them.
[package.metadata.cargo-machete]
ignored = ["getrandom", "uuid"]
